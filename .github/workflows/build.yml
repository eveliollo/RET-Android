    def set_estado(self, clave, valor):
        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT INTO estado(clave, valor) VALUES (?, ?)
            ON CONFLICT(clave) DO UPDATE SET valor=excluded.valor
            """, (clave, json.dumps(valor, ensure_ascii=False)))
            con.commit()
            con.close()

    def get_estado(self, clave, defecto=None):
        with LOCK:
            con = self.conectar()
            fila = con.execute("SELECT valor FROM estado WHERE clave=?", (clave,)).fetchone()
            con.close()
            if fila is None:
                return defecto
            try:
                return json.loads(fila["valor"])
            except Exception:
                return defecto

    def evento(self, tipo, detalle):
        with LOCK:
            con = self.conectar()
            con.execute(
                "INSERT INTO eventos(fecha,tipo,detalle) VALUES(?,?,?)",
                (ahora_epoch(), tipo, detalle)
            )
            con.commit()
            con.close()

    def listar_eventos(self, limite=50):
        with LOCK:
            con = self.conectar()
            filas = con.execute(
                "SELECT * FROM eventos ORDER BY fecha DESC LIMIT ?", (limite,)
            ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def guardar_nodo(self, nombre, host, puerto, latitud=None, longitud=None,
                     public_key=None, estado="DESCONOCIDO"):
        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT INTO nodos(nombre,host,puerto,latitud,longitud,
                              public_key,estado,ultimo_visto,creado)
            VALUES (?,?,?,?,?,?,?,?,?)
            ON CONFLICT(nombre) DO UPDATE SET
                host=excluded.host,
                puerto=excluded.puerto,
                latitud=COALESCE(excluded.latitud, nodos.latitud),
                longitud=COALESCE(excluded.longitud, nodos.longitud),
                public_key=COALESCE(excluded.public_key, nodos.public_key),
                estado=excluded.estado,
                ultimo_visto=excluded.ultimo_visto
            """, (nombre, host, puerto, latitud, longitud,
                  public_key, estado, ahora_epoch(), ahora_epoch()))
            con.commit()
            con.close()

    def actualizar_nodo_estado(self, nombre, estado):
        with LOCK:
            con = self.conectar()
            con.execute(
                "UPDATE nodos SET estado=?, ultimo_visto=? WHERE nombre=?",
                (estado, ahora_epoch(), nombre)
            )
            con.commit()
            con.close()

    def listar_nodos(self):
        with LOCK:
            con = self.conectar()
            filas = con.execute("SELECT * FROM nodos ORDER BY nombre").fetchall()
            con.close()
            return [dict(f) for f in filas]

    def obtener_nodo(self, nombre):
        with LOCK:
            con = self.conectar()
            fila = con.execute("SELECT * FROM nodos WHERE nombre=?", (nombre,)).fetchone()
            con.close()
            return dict(fila) if fila else None

    def eliminar_nodo(self, nombre):
        with LOCK:
            con = self.conectar()
            cur = con.execute("DELETE FROM nodos WHERE nombre=?", (nombre,))
            con.commit()
            eliminado = cur.rowcount > 0
            con.close()
            return eliminado

    def actualizar_ruta(self, destino, rtt=None, exito=True):
        with LOCK:
            con = self.conectar()
            anterior = con.execute(
                "SELECT * FROM rutas WHERE destino=?", (destino,)
            ).fetchone()

            if anterior is None:
                exitos   = 1 if exito else 0
                fallos   = 0 if exito else 1
                rtt_final = rtt if rtt is not None else 999999.0
            else:
                exitos      = anterior["exitos"]
                fallos      = anterior["fallos"]
                rtt_anterior = anterior["rtt"]
                if exito:
                    exitos += 1
                    if rtt is not None:
                        rtt_final = rtt if rtt_anterior >= 999999 \
                                    else 0.7 * rtt_anterior + 0.3 * rtt
                    else:
                        rtt_final = rtt_anterior
                else:
                    fallos   += 1
                    rtt_final = rtt_anterior

            if   fallos >= 5 and fallos > exitos:    salud = "CAIDO"
            elif exito and rtt_final < 50:            salud = "OPTIMO"
            elif exito and rtt_final < 150:           salud = "MEDIO"
            elif exito:                               salud = "LENTO"
            else:                                     salud = "INACCESIBLE"

            con.execute("""
            INSERT INTO rutas(destino,rtt,exitos,fallos,salud,actualizado)
            VALUES (?,?,?,?,?,?)
            ON CONFLICT(destino) DO UPDATE SET
                rtt=excluded.rtt, exitos=excluded.exitos,
                fallos=excluded.fallos, salud=excluded.salud,
                actualizado=excluded.actualizado
            """, (destino, round(rtt_final, 3), exitos, fallos, salud, ahora_epoch()))
            con.commit()
            con.close()

    def listar_rutas(self):
        with LOCK:
            con = self.conectar()
            filas = con.execute("SELECT * FROM rutas ORDER BY rtt ASC").fetchall()
            con.close()
            return [dict(f) for f in filas]

