# Tipos de tile del header PMTiles v3 (byte en offset 0x63, ver spec.md cap.3)
_PMTILES_TIPOS_VECTOR = {1, 6}   # MVT / MapLibre Vector Tile
_PMTILES_TIPOS_RASTER = {2, 3, 4, 5}  # PNG / JPEG / WebP / AVIF


def leer_cabecera_pmtiles(ruta):
    """
    Lee SOLO los 127 bytes fijos del header de un archivo .pmtiles (spec v3)
    para saber, sin descargar ni depender de internet, si el mapa es vector
    o raster y cuál es su zoom/centro por defecto — así el usuario no tiene
    que escribir coordenadas a mano en ningún lado ("mínimos detalles").
    Devuelve None si el archivo no es un pmtiles v3 válido.
    """
    try:
        with open(ruta, "rb") as f:
            cab = f.read(127)
        if len(cab) < 127 or cab[0:7] != b"PMTiles":
            return None
        version = cab[7]
        tile_type = cab[0x63]
        min_zoom  = cab[0x64]
        max_zoom  = cab[0x65]
        centro_zoom = cab[0x76]
        centro_lon  = struct.unpack_from("<i", cab, 0x77)[0] / 1e7
        centro_lat  = struct.unpack_from("<i", cab, 0x7B)[0] / 1e7

        if tile_type in _PMTILES_TIPOS_VECTOR:
            tipo = "vector"
        elif tile_type in _PMTILES_TIPOS_RASTER:
            tipo = "raster"
        else:
            tipo = "desconocido"

        return {
            "version": version,
            "tipo": tipo,
            "zoom_min": min_zoom,
            "zoom_max": max_zoom,
            "centro_zoom": centro_zoom,
            "centro_lon": centro_lon,
            "centro_lat": centro_lat,
        }
    except Exception:
        return None
