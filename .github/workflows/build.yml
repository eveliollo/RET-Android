# NUEVO: TARJETA DE CONEXIÓN + CÓDIGO QR
# ============================================================

def fnv1a_32(datos: bytes) -> int:
    """
    FNV-1a de 32 bits — un hash simple y determinista, NO criptográfico
    (para eso ya está Ed25519/X25519 en otro lado). Se usa solo para
    convertir una clave pública en un patrón visual reproducible. La
    misma implementación existe también en JavaScript (dashboard) byte
    por byte, para que la huella se vea IDÉNTICA tanto en la tarjeta
    HTML como en el navegador — si no coincidieran, la huella no
    serviría para verificar nada.
    """
    h = 2166136261
    for b in datos:
        h ^= b
        h = (h * 16777619) & 0xFFFFFFFF
    return h


def huella_hues(clave_b64: str, n: int = 6):
    """Devuelve n matices de color (0-359°) derivados de una clave pública."""
    base = clave_b64.encode("utf-8")
    return [fnv1a_32(base + f":{i}".encode("utf-8")) % 360 for i in range(n)]


def huella_svg(clave_b64: str, tam_hex: int = 20, n: int = 6, espaciado: int = 4) -> str:
    """
    Huella visual de identidad: una fila de hexágonos, cada uno con un
    color derivado de la clave pública real del nodo. Dos nodos con
    claves distintas casi con certeza se ven distintos; el mismo nodo
    siempre genera exactamente el mismo patrón — sirve para comparar
    a simple vista ("¿tus hexágonos son iguales a los míos?") en vez
    de comparar cadenas largas de texto.
    """
    hues = huella_hues(clave_b64, n)
    ancho_paso = tam_hex * 1.8 + espaciado
    ancho_total = ancho_paso * n
    alto_total = tam_hex * 2.2
    partes = [f'<svg viewBox="0 0 {ancho_total:.0f} {alto_total:.0f}" '
              f'xmlns="http://www.w3.org/2000/svg">']
    for i, hue in enumerate(hues):
        cx = ancho_paso * i + tam_hex
        cy = alto_total / 2
        r = tam_hex * 0.9
        puntos = []
        for k in range(6):
            ang = math.pi / 180 * (60 * k - 30)
            puntos.append(f"{cx + r*math.cos(ang):.1f},{cy + r*math.sin(ang):.1f}")
        partes.append(
            f'<polygon points="{" ".join(puntos)}" '
            f'fill="hsl({hue},65%,50%)" stroke="#0d1117" stroke-width="1.5"/>'
        )
    partes.append("</svg>")
    return "".join(partes)


class TarjetaRET:
    """
    Tarjeta de conexión estilo 'código de entrenador' (Pokémon GO).

    Codifica host, puerto y PIN del nodo en:
      - Un código numérico de 12 dígitos (fácil de leer/dictar)
      - Un QR real que, al escanearse, contiene el JSON de conexión
      - Una tarjeta HTML para abrir en cualquier navegador sin internet

    Otro nodo escanea el QR (o teclea el código) y se conecta directo,
    sin escribir IP/puerto/PIN a mano.
    """

    def __init__(self, nodo):
        self.nodo = nodo

    def codigo_numerico(self):
        h = hashlib.sha256(self.nodo.identidad.node_id.encode()).hexdigest()
        valor = int(h[:16], 16) % (10 ** 12)
        codigo = f"{valor:012d}"
        return f"{codigo[0:4]} {codigo[4:8]} {codigo[8:12]}"

    def payload_conexion(self):
        return {
            "ret":        FIRMA_PROTOCOLO,
            "node_id":    self.nodo.identidad.node_id,
            "nombre":     self.nodo.nombre,
            "puerto":     self.nodo.puerto,
            "ips":        mis_ips_locales(),
            "public_key": self.nodo.identidad.clave_publica_b64(),
            "x25519_pub": self.nodo.identidad.x25519_pub_b64(),
            "pin":        pin_nodo(self.nodo.identidad.node_id),
            "codigo":     self.codigo_numerico(),
        }

    def payload_b64(self):
        datos = json.dumps(
            self.payload_conexion(), ensure_ascii=False, separators=(",", ":")
        )
        return base64.urlsafe_b64encode(datos.encode("utf-8")).decode("ascii")

    def generar_qr_png(self, ruta_salida):
        if not QR_DISPONIBLE:
            return None
        qr = qrcode.QRCode(
            version=None,
            error_correction=qrcode.constants.ERROR_CORRECT_M,
            box_size=8,
            border=3,
        )
        qr.add_data("RET://" + self.payload_b64())
        qr.make(fit=True)
        img = qr.make_image(fill_color="black", back_color="white")
        img.save(str(ruta_salida))
        return ruta_salida

    def qr_terminal(self):
        if not QR_DISPONIBLE:
            print("⚠️  Instala 'qrcode' para ver el QR: pip install qrcode[pil]")
            return
        qr = qrcode.QRCode(border=1)
        qr.add_data("RET://" + self.payload_b64())
        qr.make(fit=True)
        qr.print_ascii(invert=True)

    def generar_html(self, ruta_salida, ruta_qr_png=None):
        info = self.payload_conexion()
        qr_tag = ""
        if ruta_qr_png and Path(ruta_qr_png).exists():
            qr_b64 = base64.b64encode(Path(ruta_qr_png).read_bytes()).decode("ascii")
            qr_tag = f'<img class="qr" src="data:image/png;base64,{qr_b64}"/>'

        huella_tag = huella_svg(info["public_key"])

        html = f"""<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RET — Tarjeta de {info['nombre']}</title>
<style>
  body{{font-family:sans-serif;background:#0d1117;color:#e6edf3;
       display:flex;justify-content:center;padding:24px}}
  .tarjeta{{background:#161b22;border:1px solid #30363d;border-radius:16px;
           padding:28px;max-width:360px;text-align:center}}
  h1{{color:#58a6ff;font-size:1.2em;margin-bottom:4px}}
  .codigo{{font-size:1.4em;letter-spacing:2px;color:#3fb950;
          margin:16px 0;font-family:monospace}}
  .qr{{width:220px;height:220px;background:#fff;padding:10px;
      border-radius:8px;margin:10px 0}}
  .pin{{color:#d29922;font-size:.9em}}
  .ips{{color:#8b949e;font-size:.75em;margin-top:10px}}
  .huella{{margin:14px 0 4px}}
  .huella svg{{height:28px}}
  .huella-etiqueta{{color:#8b949e;font-size:.68em;margin-top:4px}}
</style></head>
<body>
  <div class="tarjeta">
    <h1>⬡ {info['nombre']}</h1>
    <div class="codigo">{info['codigo']}</div>
    {qr_tag}
    <div class="huella">{huella_tag}</div>
    <div class="huella-etiqueta">Huella de identidad — compárala con la del otro nodo</div>
    <div class="pin">PIN: {info['pin']}</div>
    <div class="ips">{' · '.join(info['ips'])}:{info['puerto']}</div>
  </div>
</body></html>"""
        Path(ruta_salida).write_text(html, encoding="utf-8")
        return ruta_salida

    def mostrar_y_guardar(self, carpeta_base):
        carpeta_base = Path(carpeta_base)
        print("\n" + "=" * 44)
        print("  CÓDIGO DE NODO RET")
        print("=" * 44)
        print(f"  {self.codigo_numerico()}")
        print("=" * 44)
        self.qr_terminal()

        ruta_png = carpeta_base / "ret_tarjeta_qr.png"
        self.generar_qr_png(ruta_png)
        ruta_html = carpeta_base / "ret_tarjeta.html"
        self.generar_html(ruta_html, ruta_png if QR_DISPONIBLE else None)

        print(f"\n📇 Tarjeta HTML: {ruta_html}")
        if QR_DISPONIBLE:
            print(f"🖼️  QR imagen:   {ruta_png}")
        else:
            print("⚠️  Para el QR como imagen: pip install qrcode[pil]")

    @staticmethod
    def leer_payload(texto):
        if texto.startswith("RET://"):
            texto = texto[len("RET://"):]
        datos = base64.urlsafe_b64decode(texto.encode("ascii"))
        return json.loads(datos.decode("utf-8"))


