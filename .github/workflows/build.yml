        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT OR IGNORE INTO mensajes(id,origen,destino,contenido,timestamp,direccion)
            VALUES (?,?,?,?,?,?)
            """, (mensaje_id, origen, destino, contenido, ahora_epoch(), direccion))
            con.commit()
            con.close()

    def listar_mensajes(self, limite=50):
        with LOCK:
            con = self.conectar()
            filas = con.execute(
                "SELECT * FROM mensajes ORDER BY timestamp DESC LIMIT ?", (limite,)
            ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def paquete_visto(self, paquete_id):
        with LOCK:
            con = self.conectar()
            fila = con.execute(
                "SELECT id FROM paquetes_vistos WHERE id=?", (paquete_id,)
            ).fetchone()
            con.close()
            return fila is not None

    def marcar_paquete_visto(self, paquete_id):
        with LOCK:
            con = self.conectar()
            con.execute(
                "INSERT OR IGNORE INTO paquetes_vistos(id,visto) VALUES(?,?)",
                (paquete_id, ahora_epoch())
            )
            con.execute(
                "DELETE FROM paquetes_vistos WHERE visto < ?",
                (ahora_epoch() - 86400,)
            )
            con.commit()
            con.close()

    def guardar_peer_p2p(self, node_id, nombre, host, puerto,
                          public_key=None, via="DESCONOCIDO", rtt=999999,
                          modo="completo"):
        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT INTO peers_p2p(node_id,nombre,host,puerto,public_key,
                                  descubierto_via,ultimo_visto,rtt,creado,modo)
            VALUES (?,?,?,?,?,?,?,?,?,?)
            ON CONFLICT(node_id) DO UPDATE SET
                nombre=excluded.nombre,
                host=excluded.host,
                puerto=excluded.puerto,
                public_key=COALESCE(excluded.public_key, peers_p2p.public_key),
                descubierto_via=excluded.descubierto_via,
                ultimo_visto=excluded.ultimo_visto,
                modo=excluded.modo,
                rtt=CASE WHEN excluded.rtt < 999999 THEN excluded.rtt
                         ELSE peers_p2p.rtt END
            """, (node_id, nombre, host, puerto, public_key,
                  via, ahora_epoch(), rtt, ahora_epoch(), modo))
            con.commit()
            con.close()

    def listar_peers_p2p(self, solo_recientes=False):
        with LOCK:
            con = self.conectar()
            if solo_recientes:
                umbral = ahora_epoch() - 7200
                filas = con.execute(
                    "SELECT * FROM peers_p2p WHERE ultimo_visto>? ORDER BY rtt ASC",
                    (umbral,)
                ).fetchall()
            else:
                filas = con.execute(
                    "SELECT * FROM peers_p2p ORDER BY ultimo_visto DESC"
                ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def obtener_peer_p2p(self, node_id):
        with LOCK:
            con = self.conectar()
            fila = con.execute(
                "SELECT * FROM peers_p2p WHERE node_id=?", (node_id,)
            ).fetchone()
            con.close()
            return dict(fila) if fila else None

    def contar_peers_p2p(self):
        with LOCK:
            con = self.conectar()
            fila = con.execute("SELECT COUNT(*) as total FROM peers_p2p").fetchone()
            con.close()
