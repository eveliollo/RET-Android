            ORDER BY creado ASC
            """, (dest_id, ahora_epoch())).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def marcar_entregado(self, msg_id):
        with LOCK:
            con = self.conectar()
            con.execute("DELETE FROM cola_mensajes WHERE id=?", (msg_id,))
            con.commit()
            con.close()

    def incrementar_intento(self, msg_id):
