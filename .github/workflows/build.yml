            con = self.conectar()
            con.execute(
                "DELETE FROM cola_mensajes WHERE expira<?", (ahora_epoch(),)
            )
            con.commit()
            con.close()

    def iniciar_transferencia(self, tr_id, nombre, tamano, total_chunks,
                               origen, destino, estado="ENVIANDO"):
        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT OR IGNORE INTO transferencias
            (id,nombre_archivo,tamano,total_chunks,chunks_recibidos,
             origen,destino,estado,creado)
            VALUES(?,?,?,?,0,?,?,?,?)
            """, (tr_id, nombre, tamano, total_chunks, origen, destino,
                  estado, ahora_epoch()))
            con.commit()
            con.close()

    def guardar_chunk(self, tr_id, indice, datos_b64):
        with LOCK:
            con = self.conectar()
            chunk_id = f"{tr_id}-{indice}"
            con.execute("""
            INSERT OR IGNORE INTO chunks(id,transferencia_id,indice,datos_b64,timestamp)
            VALUES(?,?,?,?,?)
            """, (chunk_id, tr_id, indice, datos_b64, ahora_epoch()))
            con.execute("""
            UPDATE transferencias
            SET chunks_recibidos=chunks_recibidos+1
            WHERE id=? AND chunks_recibidos < total_chunks
            """, (tr_id,))
            con.execute("""
            UPDATE transferencias SET estado='COMPLETO'
            WHERE id=? AND chunks_recibidos>=total_chunks
            """, (tr_id,))
            con.commit()
            con.close()

    def listar_transferencias(self):
        with LOCK:
            con = self.conectar()
            filas = con.execute(
                "SELECT * FROM transferencias ORDER BY creado DESC"
            ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def chunks_de(self, tr_id):
        with LOCK:
            con = self.conectar()
            filas = con.execute(
                "SELECT * FROM chunks WHERE transferencia_id=? ORDER BY indice",
                (tr_id,)
            ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def actualizar_reputacion(self, node_id, nombre="", evento="ping_ok"):
        deltas = {
            "ping_ok":           (+10, "pings_ok"),
            "ping_fail":         (-20, "pings_fail"),
            "msg_entregado":     (+20, "msgs_entregados"),
            "msg_fallido":       (-30, "msgs_fallidos"),
            "gossip_relay":      ( +5, "gossip_relays"),
        }
        delta_score, campo = deltas.get(evento, (0, "pings_ok"))
        with LOCK:
            con = self.conectar()
            con.execute("""
            INSERT INTO reputacion(node_id,nombre,score,actualizado)
            VALUES(?,?,?,?)
            ON CONFLICT(node_id) DO UPDATE SET
                nombre=excluded.nombre,
                score=MAX(0, MIN(1000, score + ?)),
                actualizado=excluded.actualizado
            """, (node_id, nombre, REP_INICIAL, ahora_epoch(), delta_score))
            if campo:
                con.execute(
                    f"UPDATE reputacion SET {campo}={campo}+1 WHERE node_id=?",
                    (node_id,)
                )
            con.commit()
            con.close()

    def listar_reputacion(self):
        with LOCK:
            con = self.conectar()
            filas = con.execute(
                "SELECT * FROM reputacion ORDER BY score DESC"
            ).fetchall()
            con.close()
            return [dict(f) for f in filas]

    def score_de(self, node_id):
        with LOCK:
            con = self.conectar()
            fila = con.execute(
                "SELECT score FROM reputacion WHERE node_id=?", (node_id,)
            ).fetchone()
            con.close()
            return fila["score"] if fila else REP_INICIAL


