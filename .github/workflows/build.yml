# NUEVO: GUÍA RET  (inspirada en la Guía de Socxima)
# ============================================================

class GuiaRET:
    """
    Asistente local que anuncia los mensajes que te llegan y te ayuda a
    redactar respuestas a partir de una instrucción en lenguaje natural
    ("dile que voy mañana"). Nada de esto sale de tu dispositivo ni usa
    ningún servicio externo — es solo un mapeo de frases a texto, igual
    de soberano que el resto de RET.

    La idea viene de la "Guía Socima" de un proyecto hermano (Socxima);
    aquí se adapta al estilo y la arquitectura propios de RET, sin tocar
    nada del núcleo de mensajería ya probado.
    """

    NOMBRE = "Guía"

    def __init__(self):
        self.voz_activada = os.environ.get("RET_GUIA_VOZ", "") == "1"

    def anunciar_mensaje(self, origen_nombre, contenido):
        """Muestra el mensaje entrante narrado por la Guía. Además del
        texto en pantalla, intenta leerlo en voz si RET_GUIA_VOZ=1."""
        texto = f"Te llegó un mensaje de {origen_nombre}: {contenido}"
        print(f"\n{C.MAGENTA}🔊 [{self.NOMBRE}]{C.RESET} {texto}")
        if self.voz_activada:
            self.hablar(texto)

    def redactar_respuesta(self, instruccion, remitente=""):
        """
        Traduce una instrucción en lenguaje natural a un mensaje
        redactado, con las mismas reglas de la Guía original + un par
        más. Si ninguna regla aplica, se manda la instrucción tal cual
        (igual que hacía Socxima).
        """
        cmd = instruccion.lower()
        saludo = f"Hola{f' {remitente}' if remitente else ''}, "

        if "mañana" in cmd:
            respuesta = saludo + "confirmo que voy mañana."
        elif "no puedo" in cmd or "ocupado" in cmd or "ocupada" in cmd:
            respuesta = saludo + "lo siento, no puedo asistir en este momento."
        elif "en camino" in cmd or "llegando" in cmd:
            respuesta = saludo + "ya voy en camino."
        elif "gracias" in cmd:
            respuesta = saludo + "¡gracias a ti!"
        elif "de acuerdo" in cmd or "vale" in cmd or "está bien" in cmd:
            respuesta = saludo + "de acuerdo, quedamos así."
        else:
            respuesta = instruccion

        print(f"{C.MAGENTA}🔊 [{self.NOMBRE}]{C.RESET} Entendido. Redacté: \"{respuesta}\"")
        return respuesta

    def hablar(self, texto):
        """
        Intento de voz real (TTS), completamente opcional y silencioso
        si no hay nada disponible — el mensaje ya se mostró en texto.
        Prueba, en orden: Termux:API (Android), espeak (Linux), say (macOS).
        """
        import subprocess
        for comando in (
            ["termux-tts-speak", texto],
            ["espeak", "-v", "es", texto],
            ["say", texto],
        ):
            try:
                subprocess.run(comando, timeout=10, capture_output=True)
                return
            except Exception:
                continue


