def json_bytes(datos):
    return json.dumps(datos, ensure_ascii=False, separators=(",", ":")).encode("utf-8")

def hash_sha256(texto):
    return hashlib.sha256(texto.encode("utf-8")).hexdigest()

def verificar_firma(datos, firma_b64, clave_publica_b64):
    """
    Verifica una firma Ed25519 sobre `datos` (mismo formato exacto que
    usa IdentidadNodo.firmar). Devuelve False ante cualquier problema
    (firma inválida, clave corrupta, etc.) — nunca lanza excepción hacia
    afuera, porque esto se llama sobre datos que llegan de la red y no
    deben poder tumbar el proceso.
    """
    try:
        clave = Ed25519PublicKey.from_public_bytes(base64.b64decode(clave_publica_b64))
        clave.verify(base64.b64decode(firma_b64), json_bytes(datos))
        return True
    except Exception:
        return False

def haversine_km(lat1, lon1, lat2, lon2):
    """Distancia real entre dos coordenadas (línea recta sobre la
    superficie terrestre) — el mismo cálculo que ya se usa en el radar
    del dashboard (ahí en JavaScript), aquí en Python para el backend."""
    r = 6371.0
    fi1, fi2 = math.radians(lat1), math.radians(lat2)
    dfi = math.radians(lat2 - lat1)
    dlam = math.radians(lon2 - lon1)
    a = math.sin(dfi/2)**2 + math.cos(fi1)*math.cos(fi2)*math.sin(dlam/2)**2
    return 2 * r * math.asin(math.sqrt(a))

# ── Red local — sin internet ──────────────────────────────────

def mis_ips_locales():
    """
    Retorna todas las IPs locales de esta máquina.
    Sin DNS externo, sin internet — solo interfaces del sistema.
    Funciona en LAN, hotspot, cable directo, red ad-hoc.
    """
    ips = set()

    try:
        hostname = socket.gethostname()
        _, _, addrs = socket.gethostbyname_ex(hostname)
        for ip in addrs:
            if not ip.startswith("127."):
                ips.add(ip)
    except Exception:
        pass

    try:
        for res in socket.getaddrinfo(socket.gethostname(), None):
            ip = res[4][0]
            if not ip.startswith("127.") and ":" not in ip:
                ips.add(ip)
    except Exception:
        pass

    for destino_ficticio in ["10.255.255.255", "192.168.255.255", "172.16.255.255"]:
        try:
            s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            s.connect((destino_ficticio, 1))
            ip = s.getsockname()[0]
            s.close()
            if not ip.startswith("127."):
                ips.add(ip)
        except Exception:
            pass

    return sorted(ips) or ["127.0.0.1"]


def subred_base(ip):
    """Retorna la base de la subred: '192.168.1.5' → '192.168.1'"""
    partes = ip.rsplit(".", 1)
    return partes[0] if len(partes) == 2 else ip


def pin_nodo(node_id):
    """
    PIN de 6 dígitos derivado del node_id.
    Determinístico: mismo node_id → mismo PIN siempre.
    """
    valor = int(hashlib.sha256(node_id.encode()).hexdigest()[:8], 16)
    return f"{valor % 1_000_000:06d}"

def xor_distancia(id1, id2):
    """
    Distancia XOR entre dos node_id RET.
    Resultado menor = nodos más cercanos en el espacio DHT.
    """
    def a_int(nid):
        parte = nid.split("-")[-1] if "-" in nid else nid
        try:
            return int(parte, 16)
        except ValueError:
            return int(hashlib.sha256(nid.encode()).hexdigest()[:16], 16)
    return a_int(id1) ^ a_int(id2)


def obtener_certificado_tls(nombre_nodo):
    """
    Genera (o reutiliza si ya existe) un certificado TLS autofirmado
    para el dashboard, usando la misma librería 'cryptography' que ya
    usa RET para Ed25519/X25519 — sin depender de openssl externo.

    El navegador exige HTTPS (o localhost) para dar acceso a cámara y
    micrófono; sin este certificado, la videollamada no puede pedir
    permiso de cámara desde ningún dispositivo que no sea el propio
    localhost. El certificado es autofirmado: el navegador mostrará una
    advertencia de "conexión no segura" la primera vez — es normal y
    esperado en una red local propia, se acepta una vez y ya.

    Devuelve (ruta_cert, ruta_clave).
    """
    if TLS_CERT_PATH.exists() and TLS_KEY_PATH.exists():
        return TLS_CERT_PATH, TLS_KEY_PATH

    clave = rsa.generate_private_key(public_exponent=65537, key_size=2048)

    nombre_sujeto = x509.Name([
        x509.NameAttribute(NameOID.COMMON_NAME, f"RET-{nombre_nodo}"),
        x509.NameAttribute(NameOID.ORGANIZATION_NAME, "RET - Red Inteligente Persistente"),
    ])

    # Certificado válido para todas las IPs locales + localhost, así
    # sirve tanto para pruebas propias como para otros nodos de la LAN.
    nombres_alt = [x509.DNSName("localhost")]
    try:
        nombres_alt.append(x509.IPAddress(ipaddress.IPv4Address("127.0.0.1")))
    except Exception:
        pass
    for ip_local in mis_ips_locales():
        try:
            nombres_alt.append(x509.IPAddress(ipaddress.IPv4Address(ip_local)))
        except Exception:
            pass

    ahora_dt = datetime.datetime.utcnow()
    certificado = (
        x509.CertificateBuilder()
        .subject_name(nombre_sujeto)
        .issuer_name(nombre_sujeto)  # autofirmado: emisor = sujeto
        .public_key(clave.public_key())
        .serial_number(x509.random_serial_number())
        .not_valid_before(ahora_dt - datetime.timedelta(days=1))
        .not_valid_after(ahora_dt + datetime.timedelta(days=3650))  # 10 años
        .add_extension(x509.SubjectAlternativeName(nombres_alt), critical=False)
        .sign(clave, crypto_hashes.SHA256())
    )

    TLS_KEY_PATH.write_bytes(clave.private_bytes(
        encoding=Encoding.PEM,
        format=PrivateFormat.TraditionalOpenSSL,
        encryption_algorithm=NoEncryption(),
    ))
    TLS_CERT_PATH.write_bytes(certificado.public_bytes(Encoding.PEM))

    return TLS_CERT_PATH, TLS_KEY_PATH


# ============================================================
# CONTADOR DE SESIÓN — mensajes y archivos desde el arranque
# ============================================================

class ContadorSesion:
    def __init__(self):
        self.inicio             = ahora_epoch()
        self.msgs_enviados      = 0
        self.msgs_recibidos     = 0
        self.gossip_propagados  = 0
        self.archivos_enviados  = 0
        self._lock              = threading.Lock()

    def incr(self, campo):
        with self._lock:
            setattr(self, campo, getattr(self, campo) + 1)

    def resumen(self):
        uptime = int(ahora_epoch() - self.inicio)
        h = uptime // 3600
        m = (uptime % 3600) // 60
        s = uptime % 60
        return {
            "uptime":           f"{h:02d}:{m:02d}:{s:02d}",
            "msgs_enviados":    self.msgs_enviados,
            "msgs_recibidos":   self.msgs_recibidos,
            "gossip_propagados": self.gossip_propagados,
            "archivos_enviados": self.archivos_enviados,
        }


# ============================================================
# SINCRONIZADOR DE TIEMPO LOCAL — hora exacta sin internet
# ============================================================

class SincronizadorTiempo:
    def __init__(self, nodo, cliente):
        self.nodo         = nodo
        self.cliente      = cliente
        self.offset_s     = 0.0
        self.sincronizado = False
        self.fuente       = ""

    def sincronizar_con(self, host, puerto):
        t1 = ahora_epoch()
        ok, resp, rtt = self.cliente.enviar_http(
            host, puerto,
            {"tipo": "TIME_SYNC", "t1": t1},
            timeout=3
        )
        if not ok or "t2" not in resp:
            return False

        t2          = resp["t2"]
        rtt_s       = rtt / 1000.0
        self.offset_s = t2 - (t1 + rtt_s / 2)
        self.sincronizado = True
        self.fuente       = f"{host}:{puerto}"
        self.nodo.db.evento(
            "TIME_SYNC",
            f"fuente={self.fuente} offset={self.offset_s*1000:.1f}ms"
        )
        return True

    def tiempo_local(self):
        return ahora_epoch() + self.offset_s

    def estado_str(self):
        if self.sincronizado:
            return f"⏱ Sincronizado ({self.offset_s*1000:+.1f}ms vs {self.fuente})"
        return "⏱ Reloj local (no sincronizado)"


# ============================================================
# ESTADO VISUAL — barra de estado en pantalla
# ============================================================

def barra_estado(nodo, red_p2p, contador, sincro):
    """Barra de estado visual con colores antes de cada menú."""
    r = contador.resumen()

    peers_total = (nodo.db.contar_peers_p2p()
                   + len(nodo.db.listar_nodos()))

    conectado = (C.ok(f"✅ {peers_total} peer(s)")
                 if peers_total > 0
                 else C.error("🔴 Sin peers"))
    cifrado   = C.enc("🔒 E2E")
    sin_inet  = C.warn("📶 Sin internet")
    malla_n   = red_p2p.malla_gossip.tamano() if red_p2p else 0
    malla_txt = C.info(f"🕸 malla {malla_n}/{MESH_DEGREE}")
    ts        = sincro.estado_str() if sincro else "⏱ Reloj local"

    print()
    print(C.DIM + "  ┌───────────────────────────────────────────────────┐" + C.RESET)
    print(f"  {C.DIM}│{C.RESET}  {conectado}   {cifrado}   {sin_inet}"
          + " " * 4 + C.DIM + "│" + C.RESET)
    print(f"  {C.DIM}│{C.RESET}  {malla_txt}" + " " * 30 + C.DIM + "│" + C.RESET)
    print(f"  {C.DIM}│{C.RESET}  "
          f"{C.CYAN}↑{C.RESET}{r['msgs_enviados']} "
          f"{C.CYAN}↓{C.RESET}{r['msgs_recibidos']} msgs  "
          f"{C.CYAN}📁{C.RESET}{r['archivos_enviados']}  "
          f"{C.CYAN}📡{C.RESET}{r['gossip_propagados']} gossip  "
          f"{C.GRIS}⏳{r['uptime']}{C.RESET}"
          + " " * 3 + C.DIM + "│" + C.RESET)
    print(f"  {C.DIM}│  {C.GRIS}{ts:<49}{C.RESET}{C.DIM}│{C.RESET}")
    print(C.DIM + "  └───────────────────────────────────────────────────┘" + C.RESET)


