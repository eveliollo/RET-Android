class RETNodo:

    def __init__(self, nombre, puerto, secreto, modo="completo"):
        self.nombre   = nombre
        self.puerto   = puerto
        self.modo     = modo if modo in MODOS_NODO_VALIDOS else "completo"
        self.db       = BaseDatos(DB_PATH)
        self.identidad = IdentidadNodo()
        self.crypto   = CryptoRET(secreto)
        self.guia     = GuiaRET()
        self.iniciado = ahora_epoch()
        self.activo   = True
        self.db.set_estado("nombre", nombre)
        self.db.set_estado("puerto", puerto)

    def info(self):
        return {
            "sistema":    NOMBRE_SISTEMA,
            "version":    VERSION,
            "node_id":    self.identidad.node_id,
            "nombre":     self.nombre,
            "puerto":     self.puerto,
            "modo":       self.modo,
            "public_key": self.identidad.clave_publica_b64(),
            "x25519_pub": self.identidad.x25519_pub_b64(),
            "pin":        pin_nodo(self.identidad.node_id),
            "timestamp":  ahora_epoch(),
        }

    def crear_paquete(self, destino, contenido, ttl=TTL_DEFAULT):
        paquete_id = str(uuid.uuid4())
        mensaje = {
            "id":           paquete_id,
            "tipo":         "MENSAJE",
            "origen":       self.identidad.node_id,
            "origen_nombre": self.nombre,
            "destino":      destino,
            "contenido":    contenido,
            "ttl":          ttl,
            "timestamp":    ahora_epoch(),
        }
        cifrado = self.crypto.cifrar(json.dumps(mensaje, ensure_ascii=False))
        return {
            "packet_id": paquete_id,
            "tipo":      "PAQUETE_RET",
            "_ret":      FIRMA_PROTOCOLO,
            "origen":    self.identidad.node_id,
            "ttl":       ttl,
            "payload":   cifrado,
            "timestamp": ahora_epoch(),
        }

    def procesar_paquete(self, paquete):
        paquete_id = paquete.get("packet_id")
        if not paquete_id:
            return {"ok": False, "error": "packet_id ausente"}
        if self.db.paquete_visto(paquete_id):
            return {"ok": True, "duplicado": True, "packet_id": paquete_id}
        ttl = paquete.get("ttl", 0)
        if ttl <= 0:
            return {"ok": False, "error": "TTL agotado"}
        try:
            plano   = self.crypto.descifrar(paquete["payload"])
            mensaje = json.loads(plano)
        except InvalidToken:
            return {"ok": False, "error": "No se pudo autenticar o descifrar el paquete"}
        except Exception as error:
            return {"ok": False, "error": str(error)}

        self.db.marcar_paquete_visto(paquete_id)

        contenido_raw    = mensaje.get("contenido", "")
        contenido_mostrar = contenido_raw
        es_e2e           = False

        try:
            meta = json.loads(contenido_raw)
            if isinstance(meta, dict) and meta.get("e2e") and \
               "efimera" in meta and "cifrado" in meta:
                efimera_pub = X25519PublicKey.from_public_bytes(
                    base64.b64decode(meta["efimera"])
                )
                secreto = self.identidad.x25519_priv.exchange(efimera_pub)
                hkdf = HKDF(
                    algorithm=crypto_hashes.SHA256(),
                    length=32, salt=None, info=b"ret-e2e-v1",
                )
                clave_f = base64.urlsafe_b64encode(hkdf.derive(secreto))
                texto   = Fernet(clave_f).decrypt(
                    meta["cifrado"].encode("ascii")
                ).decode("utf-8")
                contenido_mostrar = texto
                es_e2e = True
        except Exception:
            pass

        self.db.guardar_mensaje(
            paquete_id,
            mensaje.get("origen"),
            mensaje.get("destino"),
            contenido_mostrar,
            "ENTRANTE_E2E" if es_e2e else "ENTRANTE",
        )
        self.db.evento(
            "MENSAJE_RECIBIDO",
            f"{mensaje.get('origen')} -> {mensaje.get('destino')}"
            + (" [E2E]" if es_e2e else ""),
        )

        print("")
        print("========================================")
        if es_e2e:
            print("🔒 MENSAJE E2E RECIBIDO  (solo tú puedes leerlo)")
        else:
            print("📩 MENSAJE RET RECIBIDO")
        print("========================================")
        print("ID:",        paquete_id)
        print("ORIGEN:",    mensaje.get("origen"))
        print("DESTINO:",   mensaje.get("destino"))
        print("CONTENIDO:", contenido_mostrar)
        if es_e2e:
            print("CIFRADO:    X25519 + HKDF + Fernet  ✅")
        print("========================================")

        # La Guía narra el mensaje entrante (ver clase GuiaRET) — puramente
        # aditivo, no cambia nada del flujo de cifrado/ACK de arriba.
        self.guia.anunciar_mensaje(
            mensaje.get("origen_nombre") or mensaje.get("origen", "?"),
            contenido_mostrar
        )

        return {
            "ok":       True,
            "tipo":     "ACK",
            "packet_id": paquete_id,
            "receptor": self.identidad.node_id,
        }


# ============================================================
# NUEVO: COMPRESOR RET  (RLE + deflate, con verificación SHA-256)
# ============================================================

class CompresorRET:
    """
    Compresión con verificación de integridad, usada para achicar lo
    que viaja por transportes lentos (Bluetooth clásico, ~1-3 Mbps) o
    para exportar el estado del nodo sin que pese tanto.

    Formato: RLE simple → deflate (zlib) → cabecera con SHA-256 del
    original para detectar corrupción al descomprimir.

    NOTA DE CORRECCIÓN: en la versión original, compress_data(b"")
    devolvía bytes vacíos, pero decompress_data(b"") no manejaba ese
    caso y lanzaba una excepción — una asimetría real, encontrada
    probando el código, no solo leyéndolo. Se corrige aquí.
    """

    MAGIC   = b"RET1"
    VERSION = 1
    _FORMATO_CABECERA = "!4sH32sQI"

    @staticmethod
    def comprimir(data: bytes) -> bytes:
        if not data:
            return b""

        rle = bytearray()
        i, n = 0, len(data)
        while i < n:
            largo = 1
            while i + largo < n and data[i] == data[i + largo] and largo < 255:
                largo += 1
            rle.append(largo)
            rle.append(data[i])
            i += largo

        payload = zlib.compress(bytes(rle), level=9)
        checksum = hashlib.sha256(data).digest()

        cabecera = struct.pack(
            CompresorRET._FORMATO_CABECERA,
            CompresorRET.MAGIC, CompresorRET.VERSION,
            checksum, len(data), len(payload)
        )
        return cabecera + payload

    @staticmethod
    def descomprimir(payload: bytes) -> bytes:
        if not payload:
            return b""   # simétrico con comprimir(b"") — antes esto lanzaba error

        tam_cabecera = struct.calcsize(CompresorRET._FORMATO_CABECERA)
        if len(payload) < tam_cabecera:
            raise ValueError("Payload inválido: más corto que la cabecera RET1.")

        magic, version, checksum, tam_original, tam_payload = struct.unpack(
            CompresorRET._FORMATO_CABECERA, payload[:tam_cabecera]
        )
        if magic != CompresorRET.MAGIC:
            raise ValueError(f"Cabecera inválida: {magic!r} (se esperaba {CompresorRET.MAGIC!r})")
        if version != CompresorRET.VERSION:
            raise ValueError(f"Versión de compresión no soportada: {version}")

        datos_comprimidos = payload[tam_cabecera:tam_cabecera + tam_payload]
        rle = zlib.decompress(datos_comprimidos)

        original = bytearray()
        i = 0
        while i < len(rle):
            largo = rle[i]
            valor = rle[i + 1]
            original.extend([valor] * largo)
            i += 2

        resultado = bytes(original)

        if hashlib.sha256(resultado).digest() != checksum:
            raise ValueError("Verificación de integridad falló — datos corruptos.")
        if len(resultado) != tam_original:
            raise ValueError("El tamaño descomprimido no coincide con el original.")

        return resultado



