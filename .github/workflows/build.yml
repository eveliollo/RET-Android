def huella_visual(node_id):
    """
    Huella visual única del nodo — como una firma en bloques.
    Generada desde el node_id: mismo ID → misma huella siempre.
    Ningún otro nodo en el mundo tiene la misma.
    """
    h      = hashlib.sha256(node_id.encode()).hexdigest()
    grises = [" ", "░", "▒", "▓", "█"]
    lineas = []
    for fila in range(4):
        linea = ""
        for col in range(8):
            v = int(h[fila * 8 + col], 16)
            linea += grises[v % len(grises)] * 2
        lineas.append(linea)
    return lineas


def imprimir_huella(node_id, nombre):
    """Muestra la huella visual del nodo con marco."""
    filas = huella_visual(node_id)
    ancho = len(filas[0])
    print(f"  {C.GRIS}┌{'─' * ancho}┐{C.RESET}")
    for f in filas:
        print(f"  {C.GRIS}│{C.RESET}{C.CYAN}{f}{C.RESET}{C.GRIS}│{C.RESET}")
    print(f"  {C.GRIS}└{'─' * ancho}┘{C.RESET}")
    print(f"  {C.DIM}{node_id}{C.RESET}")


