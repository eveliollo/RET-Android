# IDENTIDAD CRIPTOGRÁFICA PERSISTENTE  (original intacto)
# ============================================================

class IdentidadNodo:

    def __init__(self):
        self.private_key    = None   # Ed25519 — firma
        self.public_key     = None
        self.node_id        = None
        self.x25519_priv    = None   # X25519  — cifrado E2E
        self.x25519_pub     = None
        self.cargar_o_crear()

    def cargar_o_crear(self):
        if IDENTIDAD_PATH.exists():
            try:
                with open(IDENTIDAD_PATH, "r", encoding="utf-8") as f:
                    datos = json.load(f)
                privada = base64.b64decode(datos["private_key"])
                self.private_key = Ed25519PrivateKey.from_private_bytes(privada)
                self.public_key  = self.private_key.public_key()
                self.node_id     = datos["node_id"]
                self._generar_x25519()
                return
            except Exception as error:
                print("Error cargando identidad:", error)

        self.private_key = Ed25519PrivateKey.generate()
        self.public_key  = self.private_key.public_key()

        publica  = self.public_key.public_bytes(Encoding.Raw, PublicFormat.Raw)
        self.node_id = "RET-" + hashlib.sha256(publica).hexdigest()[:16].upper()

        privada = self.private_key.private_bytes(
            Encoding.Raw, PrivateFormat.Raw, NoEncryption()
        )
        datos = {
            "node_id":     self.node_id,
            "private_key": base64.b64encode(privada).decode("ascii"),
            "public_key":  base64.b64encode(publica).decode("ascii"),
        }
        with open(IDENTIDAD_PATH, "w", encoding="utf-8") as f:
            json.dump(datos, f, indent=2)

        self._generar_x25519()

    def _generar_x25519(self):
        """Genera o carga el par de claves X25519 para cifrado E2E."""
        x_path = IDENTIDAD_PATH.parent / "x25519.json"
        if x_path.exists():
            try:
                with open(x_path, "r", encoding="utf-8") as f:
                    d = json.load(f)
                raw = base64.b64decode(d["private"])
                self.x25519_priv = X25519PrivateKey.from_private_bytes(raw)
                self.x25519_pub  = self.x25519_priv.public_key()
                return
            except Exception:
                pass
        self.x25519_priv = X25519PrivateKey.generate()
        self.x25519_pub  = self.x25519_priv.public_key()
        raw = self.x25519_priv.private_bytes(Encoding.Raw, PrivateFormat.Raw, NoEncryption())
        pub = self.x25519_pub.public_bytes(Encoding.Raw, PublicFormat.Raw)
        with open(x_path, "w", encoding="utf-8") as f:
            json.dump({
                "private": base64.b64encode(raw).decode("ascii"),
                "public":  base64.b64encode(pub).decode("ascii"),
            }, f, indent=2)

    def x25519_pub_b64(self):
        pub = self.x25519_pub.public_bytes(Encoding.Raw, PublicFormat.Raw)
        return base64.b64encode(pub).decode("ascii")

    def clave_publica_b64(self):
        # NOTA DE CORRECCIÓN: en versiones anteriores faltaba el "return" aquí,
        # lo que rompía info() y la tarjeta QR con un AttributeError silencioso
        # (la función devolvía None). Se corrige sin tocar nada más.
        publica = self.public_key.public_bytes(Encoding.Raw, PublicFormat.Raw)
        return base64.b64encode(publica).decode("ascii")

    def firmar(self, datos):
        firma = self.private_key.sign(json_bytes(datos))
        return base64.b64encode(firma).decode("ascii")


# ============================================================
# CIFRADO AUTENTICADO  (original intacto)
# ============================================================

class CryptoRET:

    def __init__(self, secreto):
        clave         = hashlib.sha256(secreto.encode("utf-8")).digest()
        clave_fernet  = base64.urlsafe_b64encode(clave)
        self.fernet   = Fernet(clave_fernet)

    def cifrar(self, texto):
        return self.fernet.encrypt(texto.encode("utf-8")).decode("ascii")

    def descifrar(self, token):
        return self.fernet.decrypt(token.encode("ascii")).decode("utf-8")


